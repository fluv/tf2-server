apiVersion: batch/v1
kind: Job
metadata:
  name: tf2-rcon-notice
  namespace: tf2
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: rcon
          # Digest-pinned: the wrapper depends on /bin/sh and /rcon being
          # present in this image; a floating tag could be rebuilt as
          # scratch/distroless and break the hook, re-blocking syncs.
          image: outdead/rcon@sha256:c2e13830355729a986e28bb81ba18aa695542c90f5c87c62204462307200aee2
          command:
            - "/bin/sh"
            - "-c"
            - >-
              /rcon -a tf2-rcon:27015 -p "$RCON_PASS" "say Server's applying an update, one moment..."
              || echo "rcon notice failed (server idle or unreachable) — continuing without notice"
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          env:
            - name: RCON_PASS
              valueFrom:
                secretKeyRef:
                  name: srcds
                  key: rcon
                  optional: false
